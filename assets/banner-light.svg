<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Satoyoshi — Software Engineer at Mercari. Frontend-first, full-stack in practice.">
  <defs>
    <radialGradient id="auroraTeal" cx="20%" cy="0%" r="62%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="86%" cy="8%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraSky" cx="52%" cy="44%" r="46%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#fbfbfd"/>
  <rect width="1200" height="320" fill="url(#auroraTeal)"/>
  <rect width="1200" height="320" fill="url(#auroraViolet)"/>
  <rect width="1200" height="320" fill="url(#auroraSky)"/>

  <!-- Connected dots: the site's "plot a point, the line shows up later" idea. -->
  <g stroke="#0d9488" stroke-opacity="0.38" stroke-width="1.25" fill="none" stroke-linecap="round">
    <path d="M812 196 L884 118"/>
    <path d="M884 118 L1004 158"/>
    <path d="M1004 158 L1072 84"/>
    <path d="M1004 158 L1108 218"/>
  </g>
  <g stroke="#7c3aed" stroke-opacity="0.20" stroke-width="1.25" fill="none" stroke-dasharray="3 7" stroke-linecap="round">
    <path d="M726 96 L884 118"/>
    <path d="M1108 218 L1146 126"/>
  </g>

  <g fill="#0d9488">
    <circle cx="812" cy="196" r="3"/>
    <circle cx="884" cy="118" r="4.5"/>
    <circle cx="1004" cy="158" r="4"/>
    <circle cx="1072" cy="84" r="3.5"/>
    <circle cx="1108" cy="218" r="3"/>
  </g>
  <g fill="#7c3aed" opacity="0.75">
    <circle cx="726" cy="96" r="2.5"/>
    <circle cx="1146" cy="126" r="2.5"/>
    <circle cx="944" cy="252" r="2"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="84" y="146" fill="#14161c" font-size="60" font-weight="700" letter-spacing="-1.4">Satoyoshi</text>
    <text x="86" y="192" fill="#5c6070" font-size="20" font-weight="400" letter-spacing="0.2">Software Engineer at Mercari — frontend-first, full-stack in practice.</text>
    <text x="86" y="234" fill="#0d9488" font-size="15" font-weight="500" letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sa-san.com</text>
  </g>

  <rect x="60" y="102" width="3" height="52" rx="1.5" fill="#0d9488"/>
